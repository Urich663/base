<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System | Login</title>
    <!-- Make sure this matches your CSS filename -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Global Background Image -->
    <img src="bg-main.jpg" alt="background" class="bg-image">

    <div class="login-card">

        <!-- Sidebar Section (Hidden in the Red/White style) -->
        <div class="sidebar">
            <img src="side-bg.jpg" alt="sidebar background" class="sidebar-bg">
        </div> <!-- Added missing closing tag -->

        <!-- Form Section -->
        <div class="form-section">
            
            <!-- Optional subtle pattern -->
            <img src="form-bg.jpg" alt="form background" class="form-bg">

            <div class="form-header">
                <span class="logo">UISOCIAL</span>
            </div>

            <div class="form-body">
                <form>
                    <div class="input-group">
                        <input type="email" placeholder="User ID" required>
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>

                    <a href="index.html" class="login-btn">LOGIN</a>

                    <div class="forgot-link">
                        <a href="#">Forgot Password?</a>
                    </div>

                    <p>Powered By Imagen. @2026, All Rights Reserved!</p>
                </form>
            </div>
        </div> <!-- Added missing closing tag -->

    </div> <!-- Closing the login-card -->

</body>
</html>
